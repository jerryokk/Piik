name: Package Windows x64

# Produces one archive that runs after extraction: the App executable and the
# two helper processes it looks for beside itself. The Web UI is embedded in
# the App, so no other directory is needed.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      PIIK_REVISION: ${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build Web assets
        run: npm run build:web

      - name: Build the App
        run: cargo build --release --locked -p piik-app

      # Builds the native capture helper when it is missing, downloads the
      # pinned cloudflared release, and verifies both with their own probes.
      - name: Stage helper processes
        run: npm run app:runtime -- --target release

      - name: Assemble archive
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "piik-package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/piik-app.exe" -Destination $stage
          Copy-Item "target/release/runtime" -Destination $stage -Recurse
          [System.IO.File]::WriteAllText(
            (Join-Path $stage "REVISION"),
            "$env:PIIK_REVISION`n",
            [System.Text.Encoding]::ASCII)

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "piik-windows-amd64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          $zip = [System.IO.Compression.ZipFile]::Open(
            $zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            Get-ChildItem -Path $stage -Recurse -File | ForEach-Object {
              # Archive entries always use forward slashes, so Linux unzip
              # recreates the same tree Windows does.
              $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $zip, $_.FullName, $relative,
                [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: piik-windows-amd64
          path: piik-windows-amd64.zip
          if-no-files-found: error
