name: Package Windows x64

# Produces one archive that runs after extraction: the App executable and the
# two helper processes it looks for beside itself. The Web UI is embedded in
# the App, so no other directory is needed.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      PIIK_REVISION: ${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build Web assets
        run: npm run build:web

      - name: Build the App
        run: cargo build --release --locked -p piik-app

      # Builds the native capture helper when it is missing, downloads the
      # pinned cloudflared release, and verifies both with their own probes.
      - name: Stage helper processes
        run: npm run app:runtime -- --target release

      - name: Assemble package
        shell: pwsh
        run: |
          # The artifact action archives this directory itself, so the download
          # is already one zip. Extracting it yields the runnable tree directly.
          $stage = Join-Path $env:GITHUB_WORKSPACE "piik-windows-amd64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/piik-app.exe" -Destination $stage
          Copy-Item "target/release/runtime" -Destination $stage -Recurse
          [System.IO.File]::WriteAllText(
            (Join-Path $stage "REVISION"),
            "$env:PIIK_REVISION`n",
            [System.Text.Encoding]::ASCII)

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: piik-windows-amd64
          # Contents, not the directory itself: one level, no nested folder.
          path: piik-windows-amd64/**
          if-no-files-found: error
